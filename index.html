<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kunth Jain | Developer & Designer</title>
    <meta name="description" content="Official portfolio of Kunth Jain. Web Developer, Designer, and Creator. Check out my projects and connect with me.">
    <meta name="keywords" content="Kunth Jain, Web Developer, Portfolio, India, Designer, SolsticeCartel">
    <meta name="author" content="Kunth Jain">

    <meta property="og:title" content="Kunth Jain | Developer & Designer">
    <meta property="og:description" content="Welcome to my official portfolio. Coming Soon.">
    <meta property="og:image" content="https://kunthjain.in/me.png">
    <meta property="og:url" content="https://kunthjain.in">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: #ffffff;
            --placeholder-bg: #333333;
        }

        body.light-mode {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --placeholder-bg: #f0f0f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .header-name {
            width: 100%;
            border-top: 4px solid var(--border-color);
            border-bottom: 4px solid var(--border-color);
            padding: 15px 0;
            transition: border-color 0.3s ease;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
        }

        .profile-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--border-color);
            position: relative;
            background-color: var(--placeholder-bg);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.3s ease;
        }

        .profile-container:hover {
            transform: scale(1.02);
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-text {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 10px;
        }

        .social-icon {
            color: var(--text-color);
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s, color 0.3s ease;
        }

        .social-icon:hover {
            transform: scale(1.1);
            opacity: 0.7;
        }

        .icon {
            width: 32px;
            height: 32px;
            stroke-width: 2px;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-color);
            padding: 5px;
            transition: transform 0.2s ease, color 0.3s ease;
            z-index: 100;
            outline: none;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            margin: auto;
            display: block;
            width: auto;
            max-width: 90%;
            max-height: 80vh;
            border: 2px solid #fff;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            font-family: sans-serif;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            .profile-container {
                width: 160px;
                height: 160px;
            }
            .social-links {
                gap: 20px;
            }
            .theme-toggle {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">
        <span id="sun-icon"><i data-lucide="sun" class="icon"></i></span>
        <span id="moon-icon" style="display: none;"><i data-lucide="moon" class="icon"></i></span>
    </button>

    <div class="container">
        <div class="header-name">
            <h1>Kunth Jain</h1>
        </div>

        <div class="profile-container" onclick="openModal()">
            <img src="me.png" alt="Kunth Jain" id="profile-img" onerror="this.style.display='none'; document.getElementById('alt-text').style.display='flex'">
            <div id="alt-text" style="display:none; width:100%; height:100%; justify-content:center; align-items:center; font-weight:bold;">NO IMAGE</div>
        </div>

        <div class="status-text">
            Coming Soon
        </div>

        <div class="social-links">
            <a href="https://www.linkedin.com/in/kunthjain/" target="_blank" class="social-icon" aria-label="LinkedIn">
                <i data-lucide="linkedin" class="icon"></i>
            </a>

            <a href="https://github.com/SolsticeCartel" target="_blank" class="social-icon" aria-label="GitHub">
                <i data-lucide="github" class="icon"></i>
            </a>

            <a href="https://instagram.com/jainwin_kavish" target="_blank" class="social-icon" aria-label="Instagram">
                <i data-lucide="instagram" class="icon"></i>
            </a>

            <a href="https://www.youtube.com/@kjxeditzz" target="_blank" class="social-icon" aria-label="YouTube">
                <i data-lucide="youtube" class="icon"></i>
            </a>
        </div>
    </div>

    <div id="imageModal" class="modal" onclick="closeModal(event)">
        <span class="close" onclick="closeModal(event)">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();

        function toggleTheme() {
            document.body.classList.toggle('light-mode');

            const isLight = document.body.classList.contains('light-mode');
            const moonIcon = document.getElementById('moon-icon');
            const sunIcon = document.getElementById('sun-icon');

            if (isLight) {
                moonIcon.style.display = 'inline';
                sunIcon.style.display = 'none';
            } else {
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'inline';
            }
        }

        function openModal() {
            var modal = document.getElementById("imageModal");
            var img = document.getElementById("profile-img");
            var modalImg = document.getElementById("modal-img");

            // Only open if image is visible/valid
            if (img.style.display !== 'none') {
                modal.style.display = "flex";
                modalImg.src = img.src;
            }
        }

        function closeModal(event) {
            // Close if clicking the X or the background (but not the image itself)
            if (event.target.id === "imageModal" || event.target.className === "close") {
                document.getElementById("imageModal").style.display = "none";
            }
        }
    </script>

</body>
</html>
